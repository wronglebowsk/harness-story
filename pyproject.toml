[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-story"
version = "0.1.0"
description = "Comprehensive animated storytelling and causal telemetry for Hermes Agent sessions."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Paul Spencer"}]
dependencies = []

[project.scripts]
harness-story = "harness_story.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["harness_story*"]
